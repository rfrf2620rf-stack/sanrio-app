<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>サンリオ ゲーム 🎀</title>
  <meta name="description" content="サンリオキャラクターのかわいいゲーム！もぐらたたき＆キャラキャッチ♪ 3歳から遊べるよ♪">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    .access-gate {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .access-gate-box {
      background: #fff;
      border-radius: 16px;
      padding: 32px 28px;
      text-align: center;
      width: 90%;
      max-width: 320px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }
    .access-gate-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 16px;
    }
    .access-gate-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .access-gate-btn {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      background: #ff6b6b;
      color: #fff;
      cursor: pointer;
    }
    .access-gate-error {
      color: #e63946;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ========== アクセスゲート ========== -->
  <div id="access-gate" class="access-gate">
    <div class="access-gate-box">
      <p class="access-gate-title">🔒 合言葉を入力してください</p>
      <input type="password" id="access-gate-input" class="access-gate-input" placeholder="合言葉" autocomplete="off">
      <button id="access-gate-btn" class="access-gate-btn">入る</button>
      <p id="access-gate-error" class="access-gate-error" style="display: none">合言葉が違います</p>
    </div>
  </div>
  <script>
    (function () {
      var CODE = "fujifuji";
      var gate = document.getElementById("access-gate");
      var input = document.getElementById("access-gate-input");
      var btn = document.getElementById("access-gate-btn");
      var error = document.getElementById("access-gate-error");

      function tryUnlock() {
        if (input.value === CODE) {
          gate.style.display = "none";
        } else {
          error.style.display = "block";
          input.value = "";
          input.focus();
        }
      }

      btn.addEventListener("click", tryUnlock);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") tryUnlock();
      });
      input.focus();
    })();
  </script>

  <!-- ========== メニュー画面 ========== -->
  <div id="screen-menu" class="screen active">
    <div class="menu-area">
      <h1 class="menu-title">
        <span class="title-icon">🎀</span>
        サンリオ ゲーム
        <span class="title-icon">🎀</span>
      </h1>
      <div class="title-characters">
        <img src="images/mv-hellokitty.png" alt="キティ" class="title-char bounce-1">
        <img src="images/mv-cinnamon.png" alt="シナモン" class="title-char bounce-2">
        <img src="images/list-kuromi.png" alt="クロミ" class="title-char bounce-3">
        <img src="images/list-mymelody.png" alt="マイメロ" class="title-char bounce-4">
        <img src="images/list-pochacco.png" alt="ポチャッコ" class="title-char bounce-5">
        <img src="images/list-pompompurin.png" alt="プリン" class="title-char bounce-6">
      </div>
      <div class="menu-buttons">
        <button class="btn-menu btn-menu-mole" onclick="selectGame('mole')">
          <span class="btn-menu-icon">🕳️</span>
          <span class="btn-menu-label">もぐらたたき</span>
        </button>
        <button class="btn-menu btn-menu-catch" onclick="selectGame('catch')">
          <span class="btn-menu-icon">🫧</span>
          <span class="btn-menu-label">キャラキャッチ</span>
        </button>
        <button class="btn-menu btn-menu-ranking" onclick="showRanking()">
          <span class="btn-menu-icon">👑</span>
          <span class="btn-menu-label">ランキング</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ========== モグラたたきゲーム画面 ========== -->
  <div id="screen-mole" class="screen">
    <div class="game-hud">
      <div class="hud-row">
        <button class="btn-back" onclick="goToMenu()">🏠</button>
        <div class="score-area">
          <span class="score-label">⭐</span>
          <div id="mole-score-stars" class="score-stars"></div>
        </div>
      </div>
      <div class="timer-bar-container">
        <div id="mole-timer-bar" class="timer-bar"></div>
      </div>
    </div>
    <div id="mole-board" class="game-board"></div>
    <div id="mole-particles" class="particles-container"></div>
  </div>

  <!-- ========== キャラキャッチゲーム画面 ========== -->
  <div id="screen-catch" class="screen">
    <div class="game-hud">
      <div class="hud-row">
        <button class="btn-back" onclick="goToMenu()">🏠</button>
        <div class="score-area">
          <span class="score-label">⭐</span>
          <div id="catch-score-stars" class="score-stars"></div>
        </div>
      </div>
      <div class="timer-bar-container">
        <div id="catch-timer-bar" class="timer-bar"></div>
      </div>
    </div>
    <div id="catch-area" class="catch-area"></div>
    <div id="catch-particles" class="particles-container"></div>
  </div>

  <!-- ========== リザルト画面 ========== -->
  <div id="screen-result" class="screen">
    <div class="result-content">
      <div class="result-title">🎉 すごーい！🎉</div>
      <div id="result-new-record" class="result-new-record" style="display:none;">👑 NEW RECORD! 👑</div>
      <div id="result-stars" class="result-stars"></div>
      <div class="result-message" id="result-message">じょうずだね！</div>
      <div class="result-characters">
        <img src="images/mv-hellokitty.png" alt="キティ" class="result-char pop-in-1">
        <img src="images/list-mymelody.png" alt="マイメロ" class="result-char pop-in-2">
      </div>
      <div class="result-buttons">
        <button id="btn-restart" class="btn-play" onclick="restartGame()">
          <span class="btn-emoji">🔄</span>
          もういっかい！
        </button>
        <button class="btn-play btn-play-secondary" onclick="goToMenu()">
          <span class="btn-emoji">🏠</span>
          メニュー
        </button>
      </div>
    </div>
    <div id="confetti" class="confetti-container"></div>
  </div>

  <!-- ========== ランキング画面 ========== -->
  <div id="screen-ranking" class="screen">
    <div class="ranking-content">
      <div class="ranking-title">👑 ランキング 👑</div>

      <div class="ranking-section">
        <div class="ranking-section-title">🕳️ もぐらたたき</div>
        <div id="ranking-mole" class="ranking-list"></div>
      </div>

      <div class="ranking-section">
        <div class="ranking-section-title">🫧 キャラキャッチ</div>
        <div id="ranking-catch" class="ranking-list"></div>
      </div>

      <button class="btn-play btn-play-secondary" onclick="goToMenu()">
        <span class="btn-emoji">🏠</span>
        もどる
      </button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
